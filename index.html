<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARCH · Sistema de Exámenes</title>

<style>
  :root{
    --green-dark:#14311b;
    --green-mid:#1f4d29;
    --green:#2E7032;
    --green-light:#4EA72E;
    --gold:#b8903e;
    --gold-light:#e4c88a;
    --red:#C82828;
    --red-dark:#a31f1f;
    --bg:#f0f2ee;
    --card:#ffffff;
    --ink:#1c1f1a;
    --ink-soft:#5b6259;
    --border:#dfe3dc;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}

  /* ---------- Fox mark ---------- */
  .foxmark{display:inline-flex;align-items:center;gap:10px;}
  .foxmark svg{display:block;}
  .foxmark .word{font-family:var(--font-display);line-height:1.05;}
  .foxmark .word b{display:block;font-size:1.15em;letter-spacing:.03em;color:var(--card);}
  .foxmark .word span{display:block;font-size:.55em;color:var(--gold-light);font-style:italic;}
  .foxmark.dark .word b{color:var(--green-dark);}
  .foxmark.dark .word span{color:var(--green);}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--green-dark);
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;
    border-bottom:3px solid var(--gold);
  }
  .topbar .nav-actions{display:flex;gap:10px;align-items:center;font-size:14px;}
  .topbar .pill{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    padding:7px 14px;border-radius:20px;
    cursor:pointer;font-size:13px;color:#eef2ea;
    transition:.15s;
  }
  .topbar .pill:hover{background:rgba(255,255,255,.18);}

  /* ---------- Buttons ---------- */
  button{font-family:inherit;cursor:pointer;}
  .btn{
    border:none;border-radius:8px;padding:10px 18px;
    font-size:14px;font-weight:600;letter-spacing:.01em;
    transition:transform .1s,background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--green-light);}
  .btn-outline{background:transparent;color:var(--green-dark);border:1.5px solid var(--green-dark);}
  .btn-outline:hover{background:var(--green-dark);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{background:var(--red-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--green);color:var(--green-dark);}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- Landing ---------- */
  .landing{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(184,144,62,.12), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(46,112,50,.14), transparent 45%),
      var(--bg);
    padding:40px 20px;text-align:center;
  }
  .landing .eyebrow{font-family:var(--font-display);font-style:italic;color:var(--ink-soft);margin-bottom:6px;font-size:15px;}
  .landing h1{font-family:var(--font-display);font-size:clamp(28px,5vw,44px);margin:0 0 40px;color:var(--green-dark);}
  .role-cards{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;}
  .role-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:32px 34px;width:230px;
    box-shadow:0 10px 30px rgba(20,49,27,.06);
    border-bottom:4px solid var(--gold);
    transition:.18s;
  }
  .role-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(20,49,27,.12);}
  .role-card .icon{
    width:74px;height:74px;border-radius:50%;
    background:linear-gradient(160deg,#eef4ec,#e2ece0);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    border:1.5px solid var(--gold-light);
  }
  .role-card h3{font-family:var(--font-display);margin:0 0 6px;font-size:20px;color:var(--green-dark);}
  .role-card p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}

  /* ---------- Login mini forms ---------- */
  .login-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:30px 32px;width:340px;box-shadow:0 10px 30px rgba(20,49,27,.08);
  }
  .login-box h2{font-family:var(--font-display);margin:0 0 18px;color:var(--green-dark);font-size:22px;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fbfbfa;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);background:#fff;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .auth-switch{display:flex;border:1px solid var(--border);border-radius:9px;padding:3px;margin-bottom:20px;background:#f4f5f2;}
  .auth-switch .auth-tab{flex:1;border:none;background:transparent;padding:9px 0;font-size:13px;font-weight:600;border-radius:6px;color:var(--ink-soft);}
  .auth-switch .auth-tab.active{background:var(--green-dark);color:#fff;}

  /* ---------- Dashboard shell ---------- */
  .shell{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:220px;background:var(--green-dark);color:#eef2ea;
    display:flex;flex-direction:column;padding:18px 0;flex-shrink:0;
  }
  .sidebar .foxmark{padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
  .sidebar nav{flex:1;}
  .sidebar button.tab{
    width:100%;text-align:left;background:none;border:none;color:#d9e2d5;
    padding:12px 20px;font-size:14px;display:flex;align-items:center;gap:10px;
    border-left:3px solid transparent;
  }
  .sidebar button.tab:hover{background:rgba(255,255,255,.06);}
  .sidebar button.tab.active{background:var(--green-mid);color:#fff;border-left-color:var(--gold);font-weight:600;}
  .sidebar .logout{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);}
  .sidebar .logout button{background:none;border:none;color:#d9e2d5;font-size:13px;cursor:pointer;}
  .sidebar .logout button:hover{color:#fff;}

  .main{flex:1;overflow-y:auto;padding:28px 34px;}
  .main h1.page-title{font-family:var(--font-display);color:var(--green-dark);font-size:24px;margin:0 0 4px;}
  .breadcrumb{font-size:12px;color:var(--ink-soft);margin-bottom:22px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px;}
  .card h2{font-family:var(--font-display);font-size:17px;color:var(--green-dark);margin:0 0 16px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .stat .value{font-family:var(--font-display);font-size:28px;color:var(--green-dark);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-soft);text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:#f7f9f6;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:#e3f3e1;color:var(--green);}
  .badge.pending{background:#fdf1de;color:#a06a1f;}
  .badge.na{background:#eee;color:#888;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
    border:1.5px dashed var(--border);border-radius:12px;background:#fbfbfa;
  }
  .empty b{display:block;color:var(--green-dark);font-family:var(--font-display);font-size:16px;margin-bottom:6px;}

  /* Question builder */
  .qcard{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;background:#fbfbfa;}
  .qcard .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .qtype-badge{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--gold-light);color:#6b4e13;font-weight:700;text-transform:uppercase;}
  .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .opt-row input[type=text]{flex:1;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--green-dark);color:#fff;
    padding:14px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    font-size:14px;z-index:999;border-left:4px solid var(--gold);
    display:flex;align-items:center;gap:10px;
  }

  /* ---------- Exam taking ---------- */
  .exam-shell{
    position:fixed;inset:0;background:var(--bg);z-index:500;
    display:flex;flex-direction:column;
  }
  .exam-header{
    background:var(--green-dark);color:#fff;padding:14px 26px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid var(--gold);
  }
  .exam-timer{font-family:var(--font-display);font-size:20px;background:rgba(255,255,255,.1);padding:6px 16px;border-radius:8px;}
  .exam-body{flex:1;overflow-y:auto;padding:30px;display:flex;justify-content:center;}
  .exam-inner{width:100%;max-width:720px;}
  .exam-progress{display:flex;gap:4px;margin-bottom:22px;}
  .exam-progress .dot{flex:1;height:5px;border-radius:3px;background:var(--border);}
  .exam-progress .dot.answered{background:var(--green-light);}
  .exam-progress .dot.current{background:var(--gold);}
  .q-text{font-size:17px;font-weight:600;margin-bottom:16px;line-height:1.5;}
  .q-points{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .mc-option{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);
    border-radius:10px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.12s;
  }
  .mc-option:hover{border-color:var(--green-light);}
  .mc-option.selected{border-color:var(--green);background:#eef7ec;}
  .mc-option input{accent-color:var(--green);}
  .exam-footer{
    padding:16px 30px;border-top:1px solid var(--border);background:#fff;
    display:flex;justify-content:space-between;
  }

  /* ---------- Result / print ---------- */
  .result-sheet{background:#fff;border:1px solid var(--border);border-radius:12px;padding:34px;max-width:680px;margin:0 auto;}
  .result-sheet .rs-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--green);padding-bottom:16px;margin-bottom:20px;}
  .rs-score{text-align:center;margin:20px 0;}
  .rs-score .big{font-family:var(--font-display);font-size:52px;color:var(--green-dark);}
  .rs-score .of{color:var(--ink-soft);font-size:14px;}
  .rs-table td, .rs-table th{padding:8px 10px;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
    .btn{display:none!important;}
  }

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   MARCH · Sistema de Exámenes — lógica de la aplicación
   ============================================================ */

const STORE_KEYS = { exams:'exams', attempts:'attempts', students:'students', teachers:'teachers' };
let DB = { exams: [], attempts: [], students: [], teachers: [] };

// ------------------------------------------------------------------
// Código institucional para registrarse como profesor. Cámbialo por el
// que tú quieras y compártelo solo con tu planta docente.
// ------------------------------------------------------------------
const TEACHER_ACCESS_CODE = "MM09Q6RT";

// ------------------------------------------------------------------
// Configuración de Supabase — reemplaza estos dos valores por los tuyos.
// Se explican en las instrucciones de despliegue.
// ------------------------------------------------------------------
const SUPABASE_URL = "https://nnodwozjdhcngzmazdqe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6EUJmTTJJh_qW2XFaBfKGw_SgwKjvDN";
const SUPABASE_TABLE = "march_data";
const SUPABASE_REST = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;

let CONNECTED = false;
function initStorageMode(){ /* no requiere inicialización previa */ }

function supabaseHeaders(extra){
  return Object.assign({ 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }, extra||{});
}

let session = null; // {role:'alumno'|'profesor', name, matricula, grupo}
let currentAttempt = null; // examen en curso
let viewState = { teacherTab:'crear', studentTab:'disponibles', route:'landing', grupoSeleccionado:null };

const FOX_SVG = (size=40, dark=true) => `
<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
  <path d="M20 15 L35 45 L15 40 Z" fill="${dark?'#b8903e':'#e4c88a'}" stroke="#14311b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80 15 L65 45 L85 40 Z" fill="${dark?'#b8903e':'#e4c88a'}" stroke="#14311b" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="50" cy="55" rx="34" ry="28" fill="${dark?'#b8903e':'#e4c88a'}" stroke="#14311b" stroke-width="2.5"/>
  <circle cx="38" cy="50" r="4.5" fill="#14311b"/>
  <circle cx="62" cy="50" r="4.5" fill="#14311b"/>
  <path d="M50 58 Q50 66 42 70 Q50 74 58 70 Q50 66 50 58Z" fill="#14311b"/>
  <path d="M20 62 L4 58 M20 66 L4 68 M80 62 L96 58 M80 66 L96 68" stroke="#14311b" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;

function foxmark(dark, size){
  return `<div class="foxmark ${dark?'':'dark'}">
    ${FOX_SVG(size||40, true)}
    <div class="word"><b>MARCH</b><span>Sistema de Exámenes</span></div>
  </div>`;
}

/* ---------------- Persistence ---------------- */
async function loadAll(){
  try{
    const res = await fetch(`${SUPABASE_REST}?id=eq.1&select=*`, { headers: supabaseHeaders() });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    const row = rows[0] || {};
    DB.exams = row.exams || [];
    DB.attempts = row.attempts || [];
    DB.students = row.students || [];
    DB.teachers = row.teachers || [];
    CONNECTED = true;
  }catch(e){
    console.error(e);
    CONNECTED = false;
    toast('No se pudo conectar con la base de datos. Revisa tu conexión.');
  }
}
// Trae la colección más reciente de Supabase (para no pisar cambios de otro usuario)
async function refreshCollection(dbKey, storeKey, fallback){
  try{
    const res = await fetch(`${SUPABASE_REST}?id=eq.1&select=${storeKey}`, { headers: supabaseHeaders() });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    const arr = (rows[0] && rows[0][storeKey]) || fallback;
    DB[dbKey] = arr;
    CONNECTED = true;
    return arr;
  }catch(e){
    console.error(e);
    CONNECTED = false;
    return DB[dbKey] || fallback;
  }
}
async function saveKey(key, value, label){
  try{
    const res = await fetch(`${SUPABASE_REST}?id=eq.1`, {
      method: 'PATCH',
      headers: supabaseHeaders({ 'Content-Type':'application/json', 'Prefer':'return=minimal' }),
      body: JSON.stringify({ [key]: value })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    CONNECTED = true;
  }catch(e){
    console.error(e);
    CONNECTED = false;
    toast('No se pudo guardar '+label+'. Revisa tu conexión a internet.');
  }
}
async function saveExams(){ await saveKey(STORE_KEYS.exams, DB.exams, 'los exámenes'); }
async function saveAttempts(){ await saveKey(STORE_KEYS.attempts, DB.attempts, 'los intentos'); }
async function saveStudents(){ await saveKey(STORE_KEYS.students, DB.students, 'los alumnos'); }
async function saveTeachers(){ await saveKey(STORE_KEYS.teachers, DB.teachers, 'los profesores'); }

// Relee la colección más reciente antes de aplicar un cambio, para que dos
// dispositivos escribiendo casi al mismo tiempo no se borren datos entre sí.
async function mutateCollection(dbKey, storeKey, label, mutatorFn){
  let arr = await refreshCollection(dbKey, storeKey, DB[dbKey]);
  arr = mutatorFn(arr || []) || arr;
  DB[dbKey] = arr;
  await saveKey(storeKey, arr, label);
  return arr;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Agrupa las preguntas por su etiqueta "variante" (si tienen) y elige UNA al azar
// por cada grupo, así dos alumnos pueden tener el mismo tema con redacción distinta.
function elegirVariantesAleatorias(questions){
  const grupos = {};
  const orden = [];
  questions.forEach(q=>{
    const key = (q.variante && q.variante.trim()) ? q.variante.trim().toLowerCase() : ('__sola_'+q.id);
    if(!grupos[key]){ grupos[key]=[]; orden.push(key); }
    grupos[key].push(q);
  });
  return orden.map(key=>{
    const opciones = grupos[key];
    return opciones[Math.floor(Math.random()*opciones.length)];
  });
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = `${FOX_SVG(20,true)}<span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(viewState.route==='landing') app.innerHTML = renderLanding();
  else if(viewState.route==='login-alumno') app.innerHTML = renderLoginAlumno();
  else if(viewState.route==='login-profesor') app.innerHTML = renderLoginProfesor();
  else if(viewState.route==='alumno') app.innerHTML = renderAlumnoShell();
  else if(viewState.route==='profesor') app.innerHTML = renderProfesorShell();
  else if(viewState.route==='examen') app.innerHTML = renderExamTaking();
  else if(viewState.route==='resultado') app.innerHTML = renderResultado();
  bindEvents();
}

/* ---------------- Landing ---------------- */
function renderLanding(){
  const modeLabel = CONNECTED ? '☁️ Conectado a la base de datos' : '⚠️ Sin conexión';
  const modeTitle = CONNECTED ? 'Todos los que entren a este sitio comparten la misma base de datos.' : 'No se pudo conectar con la base de datos. Revisa tu conexión a internet.';
  return `
  <div class="topbar">
    ${foxmark(true,34)}
    <div class="nav-actions">
      <span class="pill">Módulo de Exámenes Teóricos</span>
      <span class="pill" title="${modeTitle}">${modeLabel}</span>
    </div>
  </div>
  <div class="landing">
    <div class="eyebrow">Universidad Tecnológica de Zinacantepec</div>
    <h1>Eres&hellip;</h1>
    <div class="role-cards">
      <div class="role-card">
        <div class="icon">${FOX_SVG(38,true)}</div>
        <h3>Alumno</h3>
        <p>Selecciona tu grupo, presenta tus exámenes y consulta tus calificaciones.</p>
        <button class="btn btn-primary" data-go="login-alumno" style="width:100%">Ingresar</button>
      </div>
      <div class="role-card">
        <div class="icon">🎓</div>
        <h3>Profesor</h3>
        <p>Crea exámenes, captura calificaciones y genera reportes del grupo.</p>
        <button class="btn btn-primary" data-go="login-profesor" style="width:100%">Ingresar</button>
      </div>
    </div>
  </div>`;
}

function renderLoginAlumno(){
  const mode = viewState.authMode || 'login';
  const grupos = groupList();
  return `
  <div class="topbar">${foxmark(true,34)}<button class="pill" data-go="landing">← Volver</button></div>
  <div class="landing">
    <div class="login-box">
      <div class="auth-switch">
        <button class="auth-tab ${mode==='login'?'active':''}" data-auth-mode="login">Iniciar sesión</button>
        <button class="auth-tab ${mode==='register'?'active':''}" data-auth-mode="register">Registrarme</button>
      </div>
      ${mode==='login' ? `
        <h2>Bienvenido de vuelta</h2>
        <div class="field"><label>Matrícula</label><input id="in-matricula" type="text" placeholder="25IT10021"></div>
        <button class="btn btn-primary" id="btn-entrar-alumno" style="width:100%">Ingresar</button>
        <p class="hint">¿Aún no tienes cuenta? <a href="#" data-auth-mode="register" style="color:var(--green);font-weight:600;">Regístrate aquí</a>.</p>
      ` : `
        <h2>Crear cuenta de alumno</h2>
        <div class="field"><label>Nombre completo</label><input id="reg-name" type="text" placeholder="Tu nombre"></div>

/* ---------------- Iniciar examen ---------------- */
function startExam(examId){
  const exam = DB.exams.find(e=>e.id===examId);
  if(!exam) return;
  let qs = shuffle(elegirVariantesAleatorias(exam.questions));
  if(exam.numAleatorio && exam.numAleatorio < qs.length) qs = qs.slice(0, exam.numAleatorio);
  qs = qs.map(q=> q.type==='mc' ? {...q, options: shuffle(q.options)} : q);
  currentAttempt = {
    id: uid(), examId: exam.id, examTitle: exam.title, materia: exam.materia,
    studentName: session.name, matricula: session.matricula, grupo: session.grupo,
    questions: qs, current:0,
    answers: qs.map(q=>({questionId:q.id, type:q.type, answer:null})),
    startedAt: Date.now(), durationMin: exam.duracionMin
  };
  viewState.route='examen';
  render();
}

function renderExamTaking(){
  const at = currentAttempt;
  const q = at.questions[at.current];
  const ans = at.answers[at.current];
  const progress = at.answers.map((a,i)=>{
    const cls = i===at.current ? 'current' : (a.answer!==null && a.answer!=='' ? 'answered':'');
    return `<div class="dot ${cls}"></div>`;
  }).join('');

  let body = '';
  if(q.type==='mc'){
    body = q.options.map((opt,i)=>`
      <div class="mc-option ${ans.answer===i?'selected':''}" data-select-opt="${i}">
        <input type="radio" name="mc" ${ans.answer===i?'checked':''}>
        <span>${opt.text}</span>
      </div>`).join('');
  } else {
    body = `<textarea id="open-answer" rows="7" placeholder="Escribe tu respuesta…">${ans.answer||''}</textarea>`;
  }

  return `
  <div class="exam-shell">
    <div class="exam-header">
      ${foxmark(true,30)}
      <div>${at.examTitle} · Pregunta ${at.current+1} de ${at.questions.length}</div>
      <div class="exam-timer" id="exam-timer">--:--</div>
    </div>
    <div class="exam-body"><div class="exam-inner">
      <div class="exam-progress">${progress}</div>
      <div class="q-points">${q.type==='mc'?'Opción múltiple':'Pregunta abierta'} · ${q.points} pts</div>
      <div class="q-text">${q.text}</div>
      ${body}
    </div></div>
    <div class="exam-footer">
      <button class="btn btn-ghost" id="btn-prev" ${at.current===0?'disabled':''}>← Anterior</button>
      ${at.current < at.questions.length-1
        ? `<button class="btn btn-primary" id="btn-next">Siguiente →</button>`
        : `<button class="btn btn-primary" id="btn-finish">Finalizar y entregar</button>`}
    </div>
  </div>`;
}

let examTimerInterval = null;
function startTimer(){
  clearInterval(examTimerInterval);
  const el = ()=>document.getElementById('exam-timer');
  examTimerInterval = setInterval(()=>{
    if(!currentAttempt || viewState.route!=='examen'){ clearInterval(examTimerInterval); return; }
    const elapsedMs = Date.now() - currentAttempt.startedAt;
    const totalMs = currentAttempt.durationMin*60000;
    const remain = Math.max(0, totalMs - elapsedMs);
    const m = Math.floor(remain/60000), s = Math.floor((remain%60000)/1000);
    const node = el();
    if(node) node.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(remain<=0){ clearInterval(examTimerInterval); finishExam(); }
  },500);
}

function saveCurrentAnswer(){
  if(!currentAttempt) return;
  const q = currentAttempt.questions[currentAttempt.current];
  if(q.type==='open'){
    const ta = document.getElementById('open-answer');
    if(ta) currentAttempt.answers[currentAttempt.current].answer = ta.value;
  }
}

async function finishExam(){
  saveCurrentAnswer();
  const at = currentAttempt;
  let mcScore=0, mcMax=0, openMax=0, hasOpen=false;
  at.questions.forEach((q,i)=>{
    if(q.type==='mc'){
      mcMax += q.points;
      const chosenIdx = at.answers[i].answer;
      if(chosenIdx!==null && q.options[chosenIdx] && q.options[chosenIdx].correct) mcScore += q.points;
    } else {
      openMax += q.points; hasOpen = true;
    }
  });
  const attemptRecord = {
    id: at.id, examId: at.examId, examTitle: at.examTitle, materia: at.materia,
    studentName: at.studentName, matricula: at.matricula, grupo: at.grupo,
    questions: at.questions, answers: at.answers,
    mcScore, mcMax, openScore: hasOpen? null : 0, openMax,
    totalScore: hasOpen ? mcScore : mcScore,
    maxScore: mcMax+openMax,
    status: hasOpen ? 'pendiente_revision' : 'calificado',
    date: Date.now()
  };
  await mutateCollection('attempts', STORE_KEYS.attempts, 'los intentos', arr=>{ arr.push(attemptRecord); return arr; });
  currentAttempt = null;
  clearInterval(examTimerInterval);
  viewState.route='resultado';
  viewState.resultId = attemptRecord.id;
  render();
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
// Normaliza el nombre de un grupo para evitar duplicados por mayúsculas/espacios (EVN3, evn3, EVN 3 → EVN3)
function normalizeGrupo(s){ return (s||'').trim().toUpperCase().replace(/\s+/g,''); }

// Calcula el promedio de calificación (0-10) agrupado por unidad, a partir de una lista de intentos calificados
function promedioPorUnidad(attempts){
  const buckets = {};
  attempts.filter(a=>a.status==='calificado').forEach(a=>{
    const exam = DB.exams.find(e=>e.id===a.examId);
    const unidad = (exam && exam.unidad) ? exam.unidad : 'Sin unidad';
    if(!buckets[unidad]) buckets[unidad] = { sum:0, count:0 };
    buckets[unidad].sum += (a.totalScore/a.maxScore*10);
    buckets[unidad].count += 1;
  });
  return Object.entries(buckets).map(([unidad, b])=>({ unidad, promedio: b.sum/b.count, n: b.count }))
    .sort((a,b)=> a.promedio - b.promedio);
}
function renderPromedioPorUnidadHtml(rows, tituloVacio){
  if(!rows.length) return `<p class="hint">${tituloVacio}</p>`;
  const min = Math.min(...rows.map(r=>r.promedio));
  return rows.map(r=>{
    const esMasBaja = r.promedio===min;
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>Unidad ${r.unidad} ${esMasBaja?'⚠️':''}</span>
        <span>${r.promedio.toFixed(1)} · ${r.n} calificado${r.n===1?'':'s'}</span>
      </div>
      <div style="background:var(--border);border-radius:6px;height:10px;">
        <div style="width:${Math.max(4,r.promedio*10)}%;background:${esMasBaja?'#d9534f':'var(--green-light)'};height:10px;border-radius:6px;"></div>
      </div>
    </div>`;
  }).join('');
}

    if(!name||!clave){ toast('Nombre y clave son obligatorios.'); return; }
    if(codigo.toLowerCase()!==TEACHER_ACCESS_CODE.toLowerCase()){ toast('El código institucional no es correcto.'); return; }
    btnRegistrarProfesor.disabled = true; btnRegistrarProfesor.textContent = 'Creando…';
    let ok = true, isFirst = false, aprobado = false;
    await mutateCollection('teachers', STORE_KEYS.teachers, 'los profesores', arr=>{
      if(arr.find(x=>x.clave.toLowerCase()===clave.toLowerCase())){ ok=false; return arr; }
      isFirst = arr.length===0;
      aprobado = isFirst;
      arr.push({id:uid(), name, clave, materia, email, aprobado});
      return arr;
    });
    btnRegistrarProfesor.disabled = false; btnRegistrarProfesor.textContent = 'Crear cuenta';
    if(!ok){ toast('Esa clave ya está registrada. Inicia sesión.'); viewState.authModeProf='login'; render(); return; }
    if(!aprobado){
      toast('Cuenta creada. Un profesor ya registrado debe aprobarla antes de que puedas entrar.');
      viewState.authModeProf='login'; render(); return;
    }
    session = { role:'profesor', name, clave, materia };
    viewState.route='profesor'; viewState.teacherTab='crear';
    draftQuestions = [];
    toast('Cuenta de profesor creada con éxito. Eres el primer profesor, quedaste aprobado automáticamente.');
    render();
  };

  // student tabs
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ viewState.studentTab = el.dataset.tab; render(); });
  document.querySelectorAll('[data-start-exam]').forEach(el=>el.onclick=()=>startExam(el.dataset.startExam));
  document.querySelectorAll('[data-see-result]').forEach(el=>el.onclick=()=>{ viewState.route='resultado'; viewState.resultId = el.dataset.seeResult; render(); });

  // exam taking
  const btnPrev = document.getElementById('btn-prev');
  if(btnPrev) btnPrev.onclick = ()=>{ saveCurrentAnswer(); currentAttempt.current--; render(); };
  const btnNext = document.getElementById('btn-next');
  if(btnNext) btnNext.onclick = ()=>{ saveCurrentAnswer(); currentAttempt.current++; render(); };
  const btnFinish = document.getElementById('btn-finish');
  if(btnFinish) btnFinish.onclick = ()=>{ if(confirm('¿Entregar el examen? No podrás modificar tus respuestas.')) finishExam(); };
  document.querySelectorAll('[data-select-opt]').forEach(el=>el.onclick=()=>{
    currentAttempt.answers[currentAttempt.current].answer = parseInt(el.dataset.selectOpt);
    render(); startTimer();
  });
  if(viewState.route==='examen') startTimer();

  // result print
  const btnPrint = document.getElementById('btn-print');
  if(btnPrint) btnPrint.onclick = ()=>window.print();

  // perfil alumno
  const btnGuardarPerfil = document.getElementById('btn-guardar-perfil');
  if(btnGuardarPerfil) btnGuardarPerfil.onclick = async ()=>{
    const nombre = document.getElementById('pf-nombre').value.trim();
    const grado = document.getElementById('pf-grado').value.trim();
    const grupo = normalizeGrupo(document.getElementById('pf-grupo').value);
    const correo = document.getElementById('pf-correo').value.trim();
    if(!nombre||!grupo){ toast('Nombre y grupo son obligatorios.'); return; }
    await mutateCollection('students', STORE_KEYS.students, 'los alumnos', arr=>{
      let s = arr.find(x=>x.matricula===session.matricula);
      if(!s){ s = {id:uid(), matricula:session.matricula}; arr.push(s); }
      s.name = nombre; s.grado = grado; s.grupo = grupo; s.email = correo;
      return arr;
    });
    session.name = nombre; session.grupo = grupo;
    toast('Perfil actualizado.');
    render();
  };

  // teacher tabs
  document.querySelectorAll('[data-teacher-tab]').forEach(el=>el.onclick=()=>{ viewState.teacherTab = el.dataset.teacherTab; render(); });
  document.querySelectorAll('[data-select-grupo]').forEach(el=>el.onclick=()=>{ viewState.grupoSeleccionado = el.dataset.selectGrupo; render(); });
  const backGrupos = document.querySelector('[data-back-grupos]');
  if(backGrupos) backGrupos.onclick = ()=>{ viewState.grupoSeleccionado = null; render(); };
  const clearHistorial = document.querySelector('[data-clear-historial]');
  if(clearHistorial) clearHistorial.onclick = async ()=>{
    const g = clearHistorial.dataset.clearHistorial;
    const n = DB.attempts.filter(a=>a.grupo===g).length;
    if(!confirm(`¿Borrar el historial de calificaciones del grupo ${g}? Se eliminarán ${n} presentación(es). Los alumnos y exámenes NO se tocan. Esta acción no se puede deshacer.`)) return;
    if(!confirm('Confirma una vez más: esto es permanente y no hay forma de recuperar los datos borrados. ¿Continuar?')) return;
    clearHistorial.disabled = true; clearHistorial.textContent = 'Borrando…';
    await mutateCollection('attempts', STORE_KEYS.attempts, 'los intentos', arr=> arr.filter(a=>a.grupo!==g));
    toast('Historial de calificaciones del grupo '+g+' borrado.');
    render();
  };
  const clearHistorialGlobal = document.querySelector('[data-clear-historial-global]');
  if(clearHistorialGlobal) clearHistorialGlobal.onclick = async ()=>{
    const n = DB.attempts.length;
    if(!confirm(`¿Borrar TODO el historial de calificaciones de TODOS los grupos? Se eliminarán ${n} presentación(es) en total. Los alumnos y exámenes NO se tocan. Esta acción no se puede deshacer.`)) return;
    if(!confirm('Confirma una vez más: esto afecta a todos los grupos y es permanente. ¿Continuar?')) return;
    clearHistorialGlobal.disabled = true; clearHistorialGlobal.textContent = 'Borrando…';
    await mutateCollection('attempts', STORE_KEYS.attempts, 'los intentos', arr=> []);
    toast('Todo el historial de calificaciones fue borrado.');
    render();
  };
  document.querySelectorAll('[data-approve-teacher]').forEach(el=>el.onclick=async ()=>{
    const id = el.dataset.approveTeacher;
    el.disabled = true;
    await mutateCollection('teachers', STORE_KEYS.teachers, 'los profesores', arr=>{
      const t = arr.find(x=>x.id===id);
      if(t) t.aprobado = true;
      return arr;
    });
    toast('Profesor aprobado.');
    render();
  });
  document.querySelectorAll('[data-reject-teacher]').forEach(el=>el.onclick=async ()=>{
    if(!confirm('¿Rechazar y eliminar esta solicitud de profesor?')) return;
    const id = el.dataset.rejectTeacher;
    el.disabled = true;
    await mutateCollection('teachers', STORE_KEYS.teachers, 'los profesores', arr=> arr.filter(x=>x.id!==id));
    toast('Solicitud rechazada.');
    render();
  });

  // question builder
  if(viewState.teacherTab==='crear') renderQuestionsList();
  const btnAddMc = document.getElementById('btn-add-mc');
  if(btnAddMc) btnAddMc.onclick = ()=>{ draftQuestions.push({id:uid(), type:'mc', text:'', points:2, options:[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]}); renderQuestionsList(); bindDraftEvents(); };
  const btnAddOpen = document.getElementById('btn-add-open');
  if(btnAddOpen) btnAddOpen.onclick = ()=>{ draftQuestions.push({id:uid(), type:'open', text:'', points:5}); renderQuestionsList(); bindDraftEvents(); };
  const btnToggleImport = document.getElementById('btn-toggle-import');
  if(btnToggleImport) btnToggleImport.onclick = ()=>{
    const wrap = document.getElementById('import-ia-wrap');
    wrap.style.display = wrap.style.display==='none' ? 'block' : 'none';
  };
  const btnImportIa = document.getElementById('btn-import-ia');
  if(btnImportIa) btnImportIa.onclick = ()=>{
    const raw = document.getElementById('import-ia-text').value.trim();
    if(!raw){ toast('Pega primero el JSON con las preguntas.'); return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ toast('Ese texto no es JSON válido. Revisa que esté completo y bien copiado.'); return; }
    if(!Array.isArray(parsed)){ toast('El JSON debe ser una lista de preguntas entre corchetes [ ].'); return; }
    let agregadas = 0, invalidas = 0;
    parsed.forEach(q=>{
      if(!q || typeof q.text!=='string' || !q.text.trim() || (q.type!=='mc' && q.type!=='open')){ invalidas++; return; }
      if(q.type==='mc'){
        if(!Array.isArray(q.options) || q.options.length<2 || !q.options.some(o=>o.correct) || q.options.some(o=>typeof o.text!=='string' || !o.text.trim())){ invalidas++; return; }
        draftQuestions.push({id:uid(), type:'mc', text:q.text.trim(), points:Number(q.points)||2, variante:(q.variante||'').trim(), options:q.options.map(o=>({text:o.text.trim(), correct:!!o.correct}))});
      }else{
        draftQuestions.push({id:uid(), type:'open', text:q.text.trim(), points:Number(q.points)||5, variante:(q.variante||'').trim()});
      }
      agregadas++;
    });
    renderQuestionsList(); bindDraftEvents();
    document.getElementById('import-ia-text').value = '';
    if(agregadas) toast(`${agregadas} pregunta(s) agregada(s) al banco.` + (invalidas ? ` ${invalidas} se saltaron por formato inválido.` : ''));
    else toast('No se pudo agregar ninguna pregunta. Revisa el formato del JSON.');
  };
  bindDraftEvents();

  const btnSaveExam = document.getElementById('btn-save-exam');
  if(btnSaveExam) btnSaveExam.onclick = async ()=>{
    const title = document.getElementById('ex-title').value.trim();
    const materia = document.getElementById('ex-materia').value.trim();
    const unidad = document.getElementById('ex-unidad').value.trim();
    let grupo = document.getElementById('ex-grupo').value;
    if(grupo==='__otro') grupo = document.getElementById('ex-grupo-otro').value;
    grupo = normalizeGrupo(grupo);
    const duracionMin = parseInt(document.getElementById('ex-duracion').value)||30;
    const numAleatorioRaw = document.getElementById('ex-numaleatorio').value;
    const numAleatorio = numAleatorioRaw ? parseInt(numAleatorioRaw) : null;
    if(!title || !grupo){ toast('Escribe al menos título y grupo.'); return; }
    if(draftQuestions.length===0){ toast('Agrega al menos una pregunta.'); return; }
    for(const q of draftQuestions){
      if(!q.text.trim()){ toast('Hay una pregunta sin enunciado.'); return; }
      if(q.type==='mc' && q.options.some(o=>!o.text.trim())){ toast('Completa todas las opciones.'); return; }
    }
    const newExam = { id:uid(), title, materia, unidad, grupo, profesor:session.name, profesorClave:session.clave, duracionMin, numAleatorio, questions:draftQuestions, createdAt:Date.now() };
    await mutateCollection('exams', STORE_KEYS.exams, 'los exámenes', arr=>{ arr.push(newExam); return arr; });
    draftQuestions = [];
    toast('Examen publicado con éxito.');
    viewState.teacherTab='examenes';
    render();
  };

  // mis examenes
  document.querySelectorAll('[data-del-exam]').forEach(el=>el.onclick=async ()=>{
    if(!confirm('¿Eliminar este examen?')) return;
    await mutateCollection('exams', STORE_KEYS.exams, 'los exámenes', arr=> arr.filter(e=>e.id!==el.dataset.delExam));
    render();
  });

  // calificaciones
  document.querySelectorAll('[data-grade]').forEach(el=>el.onclick=()=>renderGradingView(el.dataset.grade));
  const btnSaveGrade = document.getElementById('btn-save-grade');
  if(btnSaveGrade) btnSaveGrade.onclick = async ()=>{
    const attemptId = btnSaveGrade.dataset.attempt;
    const pointsByIdx = {};
    let openTotal = 0;
    document.querySelectorAll('[data-grade-points]').forEach(inp=>{
      const idx = parseInt(inp.dataset.gradePoints);
      const pts = parseFloat(inp.value)||0;
      pointsByIdx[idx] = pts;
      openTotal += pts;
    });
    await mutateCollection('attempts', STORE_KEYS.attempts, 'los intentos', arr=>{
      const a = arr.find(x=>x.id===attemptId);
      if(a){
        Object.keys(pointsByIdx).forEach(idx=>{ a.answers[idx].score = pointsByIdx[idx]; });
        a.openScore = openTotal;
        a.totalScore = a.mcScore + openTotal;
        a.status = 'calificado';
      }
      return arr;
    });
    toast('Calificación guardada.');
    viewState.teacherTab='calificaciones';
    render();
  };

  // alumnos admin
  const btnAddAlumno = document.getElementById('btn-add-alumno');
  if(btnAddAlumno) btnAddAlumno.onclick = async ()=>{
    const name = document.getElementById('al-nombre').value.trim();
    const matricula = document.getElementById('al-matricula').value.trim();
    const grado = document.getElementById('al-grado').value.trim();
    const grupo = normalizeGrupo(document.getElementById('al-grupo').value);
    const email = document.getElementById('al-correo').value.trim();
    if(!name||!matricula||!grupo){ toast('Nombre, matrícula y grupo son obligatorios.'); return; }
    await mutateCollection('students', STORE_KEYS.students, 'los alumnos', arr=>{ arr.push({id:uid(), name, matricula, grado, grupo, email}); return arr; });
    render();
  };
  document.querySelectorAll('[data-del-alumno]').forEach(el=>el.onclick=async ()=>{
    await mutateCollection('students', STORE_KEYS.students, 'los alumnos', arr=> arr.filter(s=>s.id!==el.dataset.delAlumno));
    render();
  });
}

function bindDraftEvents(){
  document.querySelectorAll('[data-del-q]').forEach(el=>el.onclick=()=>{ draftQuestions.splice(parseInt(el.dataset.delQ),1); renderQuestionsList(); bindDraftEvents(); });
  document.querySelectorAll('[data-q-text]').forEach(el=>el.oninput=()=>{ draftQuestions[parseInt(el.dataset.qText)].text = el.value; });
  document.querySelectorAll('[data-q-points]').forEach(el=>el.oninput=()=>{ draftQuestions[parseInt(el.dataset.qPoints)].points = parseFloat(el.value)||1; });
  document.querySelectorAll('[data-q-variante]').forEach(el=>el.oninput=()=>{ draftQuestions[parseInt(el.dataset.qVariante)].variante = el.value; });
  document.querySelectorAll('[data-q-opt]').forEach(el=>el.oninput=()=>{ const [qi,oi]=el.dataset.qOpt.split(':').map(Number); draftQuestions[qi].options[oi].text = el.value; });
  document.querySelectorAll('[data-q-correct]').forEach(el=>el.onchange=()=>{ const [qi,oi]=el.dataset.qCorrect.split(':').map(Number); draftQuestions[qi].options.forEach((o,i)=>o.correct = (i===oi)); });
}

/* ---------------- Boot ---------------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="landing"><div class="eyebrow">Cargando…</div></div>`;
  initStorageMode();
  await loadAll();
  render();
})();
</script>
</body>
</html>
